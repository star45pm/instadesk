name: deploy
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build
          sudo rm -rf /var/www/instar/*
          sudo mkdir -p /var/www/instar
          sudo cp -r dist/* /var/www/instar/
          sudo chmod -R 755 /var/www/instar/
          ls -lh /var/www/instar/ | head -20

      - name: Fix Nginx /api proxy - final
        run: |
          sudo sed -i '/rewrite ^\/api/d' /etc/nginx/sites-available/instar.xrocket.kr
          sudo sed -i '/location.*\/api\//a \ rewrite ^/api/(.*)$ /$1 break;' /etc/nginx/sites-available/instar.xrocket.kr
          sudo sed -i 's|proxy_pass http://127.0.0.1:8000/;|proxy_pass http://127.0.0.1:8000;|' /etc/nginx/sites-available/instar.xrocket.kr
          sudo nginx -t && sudo systemctl reload nginx
          curl -s http://127.0.0.1:8000/; echo
          curl -k -s https://instar.xrocket.kr/api/; echo

      - name: Restart Backend
        run: |
          sudo systemctl restart instadesk || true
          sleep 3
          curl -f http://127.0.0.1:8000/ || true
          echo "deploy done"
