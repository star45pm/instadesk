name: STAR45 Deploy - InstaDesk
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Build and Deploy
        run: |
          set -e
          echo "=== FIND MAIN FILE ==="
          MAIN_FILE=$(find. -maxdepth 3 -type f -name "main.py" -o -name "app.py" | head -1)
          echo "Main file found: $MAIN_FILE"
          if [ -z "$MAIN_FILE" ]; then MAIN_FILE="main.py"; fi

          sudo mkdir -p /opt/instadesk
          sudo rsync -av --exclude='.git' --exclude='node_modules'./ /opt/instadesk/ --delete

          echo "=== CREATE SERVICE ==="
          sudo tee /etc/systemd/system/instadesk.service > /dev/null << SERVICE
          [Unit]
          Description=InstaDesk Backend
          After=network.target
          [Service]
          Type=simple
          WorkingDirectory=/opt/instadesk
          ExecStart=/usr/bin/python3 /opt/instadesk/$MAIN_FILE
          Restart=always
          User=root
          Environment=PYTHONUNBUFFERED=1
          [Install]
          WantedBy=multi-user.target
          SERVICE

          sudo systemctl daemon-reload
          sudo systemctl enable instadesk
          sudo systemctl restart instadesk || sudo systemctl start instadesk
          sleep 3
          sudo systemctl status instadesk --no-pager | tail -30
          sudo journalctl -u instadesk -n 50 --no-pager || true

      - name: Connect Nginx + SSL
        run: |
          sudo cat > /etc/nginx/sites-available/instadesk << 'NG'
          server {
              listen 80;
              server_name instar.xrocket.kr;
              location / {
                  proxy_pass http://127.0.0.1:8000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
          NG
          sudo ln -sf /etc/nginx/sites-available/instadesk /etc/nginx/sites-enabled/instadesk
          sudo nginx -t && sudo systemctl reload nginx
          sudo apt install certbot python3-certbot-nginx -y || true
          sudo certbot --nginx -d instar.xrocket.kr --non-interactive --agree-tos -m admin@xrocket.kr --redirect || true
          sudo systemctl reload nginx
