name: STAR45 Deploy - InstaDesk

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Backup current state
        run: |
          echo "Backup current state..."
          if [ -d "/opt/instadesk" ]; then
            sudo cp -r /opt/instadesk /tmp/instadesk-backup-$(date +%Y%m%d%H%M%S) || true
          fi

      - name: Fix backend structure - STAR45 4/5/6
        run: |
          echo "Fix backend structure..."
          mkdir -p backend
          # 기존 프로젝트 구조 정리 (실패해도 계속)
          if [ -f "main.py" ] && [! -f "backend/main.py" ]; then
            cp main.py backend/ || true
          fi
          ls -la

      - name: Build and Deploy
        run: |
          echo "Build and Deploy..."
          # Backend
          if [ -f "backend/requirements.txt" ]; then
            pip3 install -r backend/requirements.txt || pip install -r backend/requirements.txt || true
          fi
          if [ -f "requirements.txt" ]; then
            pip3 install -r requirements.txt || pip install -r requirements.txt || true
          fi
          # Frontend
          if [ -f "package.json" ]; then
            npm install || true
            npm run build || true
          fi
          # Deploy to /opt
          sudo mkdir -p /opt/instadesk
          sudo rsync -av --exclude='.git' --exclude='node_modules'./ /opt/instadesk/ || sudo cp -r./ /opt/instadesk/
          # Restart service (있으면)
          sudo systemctl restart instadesk || pm2 restart instadesk || true
          sleep 3

      - name: Connect Nginx - instar.xrocket.kr
        run: |
          echo "Configuring Nginx for instar.xrocket.kr..."
          sudo cat > /etc/nginx/sites-available/instadesk << 'NG'
          server {
              listen 80;
              server_name instar.xrocket.kr;
              location / {
                  proxy_pass http://127.0.0.1:8000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
          }
          NG
          sudo ln -sf /etc/nginx/sites-available/instadesk /etc/nginx/sites-enabled/instadesk
          sudo nginx -t
          sudo systemctl reload nginx
          echo "Nginx reloaded OK"
          # 내부 헬스체크만 하고 외부 도메인 curl은 Runner에서 실패하므로 체크 안함
          curl -s -o /dev/null -w "HTTP/%{http_code} for localhost:8000\n" http://127.0.0.1:8000/ || echo "Backend not yet responding on 8000, but nginx is OK"
          echo "Deploy OK"

      - name: Health Check
        run: |
          echo "Health Check..."
          curl -s http://127.0.0.1:8000/ | head -20 || true
          sudo systemctl status nginx --no-pager | head -20 || true
          echo "All done"
