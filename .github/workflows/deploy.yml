name: deploy
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Build Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build
          sudo rm -rf /var/www/instar/*
          sudo mkdir -p /var/www/instar
          sudo cp -r dist/* /var/www/instar/
          sudo chmod -R 755 /var/www/instar/

      - name: Overwrite Nginx Config - FINAL FIX
        run: |
          sudo tee /etc/nginx/sites-available/instar.xrocket.kr > /dev/null <<'NGINX'
          server {
              listen 80;
              server_name instar.xrocket.kr;
              return 301 https://$host$request_uri;
          }
          server {
              listen 443 ssl http2;
              server_name instar.xrocket.kr;

              ssl_certificate /etc/letsencrypt/live/instar.xrocket.kr/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/instar.xrocket.kr/privkey.pem;

              root /var/www/instar;
              index index.html;

              location /api/ {
                  rewrite ^/api/(.*)$ /$1 break;
                  proxy_pass http://127.0.0.1:8000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }

              location / {
                  try_files $uri $uri/ /index.html;
              }
          }
          NGINX
          sudo nginx -t
          sudo systemctl reload nginx
          sleep 1
          echo "=== backend direct ==="
          curl -s http://127.0.0.1:8000/ || true
          echo ""
          echo "=== via nginx /api/ ==="
          curl -k -s https://instar.xrocket.kr/api/ || true
          echo ""

      - name: Restart Backend
        run: |
          sudo systemctl restart instadesk || true
          sleep 3
          curl -s http://127.0.0.1:8000/ || true
