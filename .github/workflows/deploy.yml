name: deploy
on:
  push:
    branches: [main]
jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4
      - name: Build Frontend
        working-directory: frontend
        run: |
          npm install
          npm run build
          sudo rm -rf /var/www/instar/*
          sudo mkdir -p /var/www/instar
          sudo cp -r dist/* /var/www/instar/
          sudo chmod -R 755 /var/www/instar/
      - name: Fix Backend 502 Forever
        run: |
          echo "PWD $GITHUB_WORKSPACE"
          ls -la $GITHUB_WORKSPACE/backend || ls -la $GITHUB_WORKSPACE
          pip3 install fastapi uvicorn -q || true
          if [ -f $GITHUB_WORKSPACE/backend/requirements.txt ]; then pip3 install -r $GITHUB_WORKSPACE/backend/requirements.txt -q || true; fi
          if [ -f $GITHUB_WORKSPACE/requirements.txt ]; then pip3 install -r $GITHUB_WORKSPACE/requirements.txt -q || true; fi
          sudo tee /etc/systemd/system/instadesk.service > /dev/null <<SERVICE
          [Unit]
          Description=InstaDesk Backend
          After=network.target
          [Service]
          WorkingDirectory=$GITHUB_WORKSPACE/backend
          ExecStart=/usr/bin/python3 -m uvicorn main:app --host 127.0.0.1 --port 8000
          Restart=always
          RestartSec=2
          Environment=PYTHONUNBUFFERED=1
          [Install]
          WantedBy=multi-user.target
          SERVICE
          sudo systemctl daemon-reload
          sudo systemctl enable instadesk
          sudo systemctl restart instadesk
          sleep 4
          sudo systemctl status instadesk --no-pager -l || true
          sudo journalctl -u instadesk -n 80 --no-pager || true
          curl -s http://127.0.0.1:8000/ && echo " <- BACKEND OK" || echo "BACKEND STILL DOWN"
      - name: Nginx Final
        run: |
          sudo tee /etc/nginx/sites-available/instar.xrocket.kr > /dev/null <<'NGINX'
          server {
              listen 80;
              server_name instar.xrocket.kr;
              return 301 https://$host$request_uri;
          }
          server {
              listen 443 ssl http2;
              server_name instar.xrocket.kr;
              ssl_certificate /etc/letsencrypt/live/instar.xrocket.kr/fullchain.pem;
              ssl_certificate_key /etc/letsencrypt/live/instar.xrocket.kr/privkey.pem;
              root /var/www/instar;
              index index.html;
              location /api/ {
                  proxy_pass http://127.0.0.1:8000/;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
              location /api {
                  proxy_pass http://127.0.0.1:8000;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                  proxy_set_header X-Forwarded-Proto $scheme;
              }
              location / {
                  try_files $uri $uri/ /index.html;
              }
          }
          NGINX
          sudo ln -sf /etc/nginx/sites-available/instar.xrocket.kr /etc/nginx/sites-enabled/instar.xrocket.kr
          sudo nginx -t
          sudo systemctl reload nginx
          echo "DEPLOY DONE"
