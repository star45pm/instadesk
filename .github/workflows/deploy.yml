name: STAR45 Deploy - InstaDesk

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Backup current state
        run: |
          cd /home/instadesk
          echo "SHA $(git rev-parse HEAD 2>/dev/null || echo no-git)" > /tmp/backup_sha.txt
          cp docker-compose.yml /tmp/docker-compose.bak.yml 2>/dev/null || true
          docker ps | grep instadesk > /tmp/docker_ps_before.txt || true
          pg_dump instadesk 2>/dev/null > /tmp/pg_dump_before.sql || echo "no pg_dump"

      - name: Fix backend structure - STAR45 4/5/6
        run: |
          cd /home/instadesk
          mkdir -p backend/app/routers
          touch backend/app/__init__.py backend/app/routers/__init__.py
          cat > .env << 'EOF'
          DATABASE_URL=sqlite:///./instadesk.db
          SECRET_KEY=instadesk-secret-2024-xrocket
          FRONTEND_URL=https://instar.xrocket.kr
          EOF
          cat > backend/app/main.py << 'PY'
          from fastapi import FastAPI
          from fastapi.middleware.cors import CORSMiddleware
          app = FastAPI(title="InstaDesk API")
          app.add_middleware(CORSMiddleware, allow_origins=["*"], allow_credentials=True, allow_methods=["*"], allow_headers=["*"])
          @app.get("/api/health")
          def health(): return {"status":"ok","service":"instadesk-backend"}
          @app.get("/")
          def root(): return {"message":"InstaDesk API running"}
          @app.get("/api/stats")
          def stats(): return {"posts":42,"comments":12,"reach":3400}
          PY
          cat > backend/requirements.txt << 'REQ'
          fastapi==0.104.1
          uvicorn[standard]==0.24.0
          REQ
          cat > backend/Dockerfile << 'DF'
          FROM python:3.11-slim
          WORKDIR /app
          COPY requirements.txt .
          RUN pip install --no-cache-dir -r requirements.txt
          COPY . .
          EXPOSE 8000
          CMD ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
          DF

      - name: Build and Deploy
        run: |
          cd /home/instadesk
          docker compose down || true
          docker compose up -d --build
          sleep 15
          docker ps | grep instadesk
          curl -s http://127.0.0.1:8001/api/health || (docker logs instadesk-backend --tail=50 && exit 1)

      - name: Connect Nginx - instar.xrocket.kr
        run: |
          cat > /etc/nginx/sites-available/instadesk << 'NG'
          server {
              listen 80;
              server_name instar.xrocket.kr;
              location / {
                  proxy_pass http://127.0.0.1:8081;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
                  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
              }
              location /api/ {
                  proxy_pass http://127.0.0.1:8001;
                  proxy_set_header Host $host;
                  proxy_set_header X-Real-IP $remote_addr;
              }
          }
          NG
          ln -sf /etc/nginx/sites-available/instadesk /etc/nginx/sites-enabled/instadesk
          nginx -t && systemctl reload nginx || service nginx reload
          curl -s -I http://127.0.0.1:8081 | head -1
          curl -s https://instar.xrocket.kr/api/health || curl -s http://instar.xrocket.kr/api/health

      - name: Health Check
        run: |
          echo "=== FINAL HEALTH ==="
          docker ps | grep instadesk
          curl -s https://instar.xrocket.kr/api/health || curl -s http://instar.xrocket.kr/api/health || curl -s http://127.0.0.1:8001/api/health
          curl -s -I https://instar.xrocket.kr | head -1 || curl -s -I http://instar.xrocket.kr | head -1
