services:
  backend:
    build: ./backend
    container_name: instadesk-backend
    expose: ["8000"]
    env_file: [.env]
    ports: ["127.0.0.1:8001:8000"]
    restart: unless-stopped
  frontend:
    build: ./frontend
    container_name: instadesk-frontend
    expose: ["80"]
    ports: ["127.0.0.1:8081:80"]
    restart: unless-stopped
